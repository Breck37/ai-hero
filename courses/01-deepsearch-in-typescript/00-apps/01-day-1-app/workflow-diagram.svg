<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1f2937; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #374151; }
      .label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; fill: #6b7280; }
      .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .loop-arrow { stroke: #8b5cf6; stroke-width: 3; fill: none; marker-end: url(#arrowhead-purple); }
      .parallel-arrow { stroke: #10b981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f9fafb"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">DeepSearch Application Workflow</text>
  
  <!-- User Input Section -->
  <rect x="50" y="60" width="200" height="80" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="85" text-anchor="middle" class="label">User Asks Question</text>
  <text x="150" y="105" text-anchor="middle" class="small-label">Frontend sends POST</text>
  <text x="150" y="120" text-anchor="middle" class="small-label">to /api/chat</text>
  
  <!-- Authentication -->
  <rect x="50" y="160" width="200" height="60" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="185" text-anchor="middle" class="label">Authentication</text>
  <text x="150" y="200" text-anchor="middle" class="small-label">Check user session</text>
  
  <!-- Rate Limiting -->
  <rect x="50" y="240" width="200" height="60" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="265" text-anchor="middle" class="label">Rate Limiting</text>
  <text x="150" y="280" text-anchor="middle" class="small-label">Global LLM call limits</text>
  
  <!-- Agent Loop Start -->
  <rect x="50" y="320" width="200" height="60" rx="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="345" text-anchor="middle" class="label">Agent Loop Starts</text>
  <text x="150" y="360" text-anchor="middle" class="small-label">SystemContext created</text>
  
  <!-- Loop Section -->
  <rect x="300" y="60" width="800" height="600" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="700" y="85" text-anchor="middle" class="subtitle">Agent Loop (Max 10 iterations)</text>
  
  <!-- Step 1: Query Rewriter -->
  <rect x="320" y="100" width="180" height="80" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="410" y="125" text-anchor="middle" class="label">1. Query Rewriter</text>
  <text x="410" y="140" text-anchor="middle" class="small-label">Chain-of-thought planning</text>
  <text x="410" y="155" text-anchor="middle" class="small-label">Generate 3-5 queries</text>
  <text x="410" y="170" text-anchor="middle" class="small-label">+ research plan</text>
  
  <!-- Step 2: Parallel Search -->
  <rect x="320" y="200" width="180" height="80" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="225" text-anchor="middle" class="label">2. Parallel Search</text>
  <text x="410" y="240" text-anchor="middle" class="small-label">Execute all queries</text>
  <text x="410" y="255" text-anchor="middle" class="small-label">simultaneously</text>
  
  <!-- Search Subprocesses -->
  <rect x="520" y="180" width="120" height="40" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
  <text x="580" y="200" text-anchor="middle" class="small-label">Serper API</text>
  <text x="580" y="210" text-anchor="middle" class="small-label">Search Results</text>
  
  <rect x="520" y="230" width="120" height="40" rx="6" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>
  <text x="580" y="250" text-anchor="middle" class="small-label">Web Scraper</text>
  <text x="580" y="260" text-anchor="middle" class="small-label">Full Content</text>
  
  <rect x="520" y="280" width="120" height="40" rx="6" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <text x="580" y="300" text-anchor="middle" class="small-label">AI Summarizer</text>
  <text x="580" y="310" text-anchor="middle" class="small-label">Condensed Content</text>
  
  <!-- Step 3: Save to Context -->
  <rect x="320" y="300" width="180" height="60" rx="8" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <text x="410" y="325" text-anchor="middle" class="label">3. Save to Context</text>
  <text x="410" y="340" text-anchor="middle" class="small-label">Update SystemContext</text>
  <text x="410" y="355" text-anchor="middle" class="small-label">with search results</text>
  
  <!-- Step 4: Decision -->
  <rect x="320" y="380" width="180" height="80" rx="8" fill="#ec4899" stroke="#db2777" stroke-width="2"/>
  <text x="410" y="405" text-anchor="middle" class="label">4. Decision</text>
  <text x="410" y="420" text-anchor="middle" class="small-label">getNextAction()</text>
  <text x="410" y="435" text-anchor="middle" class="small-label">Continue or Answer?</text>
  <text x="410" y="450" text-anchor="middle" class="small-label">Based on context</text>
  
  <!-- Decision Paths -->
  <rect x="520" y="400" width="120" height="40" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <text x="580" y="420" text-anchor="middle" class="small-label">Continue</text>
  <text x="580" y="430" text-anchor="middle" class="small-label">More searches needed</text>
  
  <rect x="520" y="450" width="120" height="40" rx="6" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <text x="580" y="470" text-anchor="middle" class="small-label">Answer</text>
  <text x="580" y="480" text-anchor="middle" class="small-label">Sufficient information</text>
  
  <!-- Answer Generation -->
  <rect x="680" y="400" width="180" height="80" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="770" y="425" text-anchor="middle" class="label">Answer Generation</text>
  <text x="770" y="440" text-anchor="middle" class="small-label">answerQuestion()</text>
  <text x="770" y="455" text-anchor="middle" class="small-label">Stream response</text>
  <text x="770" y="470" text-anchor="middle" class="small-label">with citations</text>
  
  <!-- Frontend Updates -->
  <rect x="680" y="500" width="180" height="60" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="770" y="525" text-anchor="middle" class="label">Frontend Updates</text>
  <text x="770" y="540" text-anchor="middle" class="small-label">Real-time annotations</text>
  <text x="770" y="555" text-anchor="middle" class="small-label">Research steps display</text>
  
  <!-- Database Operations -->
  <rect x="900" y="60" width="180" height="120" rx="8" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="990" y="85" text-anchor="middle" class="label">Database Operations</text>
  <text x="990" y="105" text-anchor="middle" class="small-label">• Save chat messages</text>
  <text x="990" y="120" text-anchor="middle" class="small-label">• Record errors</text>
  <text x="990" y="135" text-anchor="middle" class="small-label">• Update chat titles</text>
  <text x="990" y="150" text-anchor="middle" class="small-label">• Rate limit tracking</text>
  <text x="990" y="165" text-anchor="middle" class="small-label">• Usage statistics</text>
  
  <!-- Arrows -->
  <!-- Main flow -->
  <line x1="250" y1="100" x2="320" y2="100" class="arrow"/>
  <line x1="250" y1="190" x2="320" y2="190" class="arrow"/>
  <line x1="250" y1="270" x2="320" y2="270" class="arrow"/>
  <line x1="250" y1="330" x2="320" y2="330" class="arrow"/>
  
  <!-- Loop flow -->
  <line x1="410" y1="180" x2="410" y2="200" class="arrow"/>
  <line x1="410" y1="280" x2="410" y2="300" class="arrow"/>
  <line x1="410" y1="360" x2="410" y2="380" class="arrow"/>
  
  <!-- Parallel search arrows -->
  <line x1="500" y1="200" x2="520" y2="200" class="parallel-arrow"/>
  <line x1="500" y1="250" x2="520" y2="250" class="parallel-arrow"/>
  <line x1="500" y1="300" x2="520" y2="300" class="parallel-arrow"/>
  
  <!-- Decision arrows -->
  <line x1="500" y1="420" x2="520" y2="420" class="arrow"/>
  <line x1="500" y1="470" x2="520" y2="470" class="arrow"/>
  
  <!-- Continue loop arrow -->
  <path d="M 410 460 L 410 480 L 300 480 L 300 140" class="loop-arrow"/>
  
  <!-- Answer path -->
  <line x1="640" y1="440" x2="680" y2="440" class="arrow"/>
  
  <!-- Frontend update -->
  <line x1="770" y1="480" x2="770" y2="500" class="arrow"/>
  
  <!-- Database connections -->
  <line x1="680" y1="120" x2="900" y2="120" class="arrow"/>
  <line x1="680" y1="530" x2="900" y2="530" class="arrow"/>
  
  <!-- Legend -->
  <rect x="50" y="700" width="1100" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="70" y="720" class="subtitle">Legend:</text>
  
  <rect x="70" y="730" width="20" height="12" fill="#10b981"/>
  <text x="100" y="740" class="small-label">Planning & Answer Generation</text>
  
  <rect x="70" y="750" width="20" height="12" fill="#f59e0b"/>
  <text x="100" y="760" class="small-label">Search & Authentication</text>
  
  <rect x="250" y="730" width="20" height="12" fill="#8b5cf6"/>
  <text x="280" y="740" class="small-label">Core Agent Logic</text>
  
  <rect x="250" y="750" width="20" height="12" fill="#ec4899"/>
  <text x="280" y="760" class="small-label">Decision Making</text>
  
  <rect x="450" y="730" width="20" height="12" fill="#3b82f6"/>
  <text x="480" y="740" class="small-label">External APIs & Frontend</text>
  
  <rect x="450" y="750" width="20" height="12" fill="#6b7280"/>
  <text x="480" y="760" class="small-label">Database Operations</text>
  
  <line x1="650" y1="736" x2="680" y2="736" class="arrow"/>
  <text x="690" y="740" class="small-label">Main Flow</text>
  
  <line x1="650" y1="756" x2="680" y2="756" class="loop-arrow"/>
  <text x="690" y="760" class="small-label">Loop Back</text>
  
  <line x1="800" y1="736" x2="830" y2="736" class="parallel-arrow"/>
  <text x="840" y="740" class="small-label">Parallel Execution</text>
</svg> 